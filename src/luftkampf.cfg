# The original file carries load address $1201 (saved on an expanded VC20),
# but the program only runs from $0401 (VC20 + 3K: BASIC start), see SYS 1039.
MEMORY {
    HDR:  start = $0000, size = 2,     file = %O;
    RAM:  start = $0401, size = $1A00, file = %O;
}
SEGMENTS {
    HEADER: load = HDR, type = ro;
    CODE:   load = RAM, type = rw;
}
